<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Grievance Management System</title>

    <link rel="stylesheet" href="login_page.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Section -->
        <div class="welcome-section">

            <div class="logo">
                SGMS
            </div>

            <h1>Smart Grievance<br>Management System</h1>

            <p>
                A simple and organized platform for
                registering and managing grievances.
            </p>

        </div>


        <!-- Right Section -->
        <div class="login-section">

            <div class="login-box">

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to access your grievance portal
                </p>


                <form action="../dashboard/dashboard.html">

                    <div class="input-group">

                        <label for="email">
                            User ID / Email
                        </label>

                        <input
                            type="text"
                            id="email"
                            placeholder="Enter your User ID or Email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your Password"
                            required
                        >

                    </div>


                    <div class="login-options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="help-text">
                    Having trouble logging in?
                    <a href="#">Contact Support</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
